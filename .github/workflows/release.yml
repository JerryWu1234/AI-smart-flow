name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-state:
    name: Inspect release state
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      registry_published: ${{ steps.state.outputs.registry_published }}
      has_changesets: ${{ steps.state.outputs.has_changesets }}
      bootstrap_required: ${{ steps.state.outputs.bootstrap_required }}
      publish_ready: ${{ steps.state.outputs.publish_ready }}

    steps:
      - name: Check out verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Inspect npm and Changesets state
        id: state
        run: node scripts/release/status.mjs

      - name: Explain bootstrap requirement
        if: steps.state.outputs.bootstrap_required == 'true'
        run: |
          {
            echo '## Manual npm bootstrap required'
            echo
            echo 'Publish `@jerrywu1234/smartflow@0.1.0` once with npm 2FA, configure the `release.yml` trusted publisher, then run this workflow again.'
          } >> "$GITHUB_STEP_SUMMARY"

  version:
    name: Prepare Version PR
    needs: release-state
    if: >-
      needs.release-state.outputs.bootstrap_required == 'false' &&
      needs.release-state.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Check out verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update Version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm release:version
          commit: "chore: version @jerrywu1234/smartflow"
          title: "chore: release @jerrywu1234/smartflow"
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI for the Version PR commit
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          head_ref="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$head_ref"

  publish:
    name: Publish CLI
    needs: release-state
    if: >-
      needs.release-state.outputs.registry_published == 'true' ||
      needs.release-state.outputs.publish_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.0

      - name: Configure release tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish npm package, tag, and GitHub Release
        run: pnpm release:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
